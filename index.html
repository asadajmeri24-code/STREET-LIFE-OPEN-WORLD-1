<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LIFE STREET - Map & Movement</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #09090b; color: #fff; min-height: 100vh; padding: 12px; }

    .wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }

    .top-bar {
      background: #111827; border: 1px solid #1f2937; border-radius: 14px;
      padding: 10px 14px; display: flex; justify-content: space-between; align-items: center;
      font-size: 12px; font-weight: 700;
    }
    .pill { background: #1f2937; padding: 5px 10px; border-radius: 10px; }

    #world {
      position: relative; height: 350px; width: 100%;
      background: #0f172a; border: 2px solid #334155; border-radius: 18px; overflow: hidden;
    }

    .hangout {
      position: absolute; top: 0; left: 0; width: 50%; height: 45%;
      background: rgba(34, 197, 94, 0.14); border-right: 1px dashed #475569; border-bottom: 1px dashed #475569;
      padding: 10px; font-size: 11px; font-weight: 700; color: #86efac;
    }

    .action-spot {
      position: absolute; top: 0; right: 0; width: 50%; height: 45%;
      background: rgba(239, 68, 68, 0.14); border-bottom: 1px dashed #475569;
      padding: 10px; font-size: 11px; font-weight: 700; color: #fca5a5; text-align: right;
    }

    .street {
      position: absolute; bottom: 0; left: 0; width: 100%; height: 55%;
      background: #1e293b; padding: 10px;
    }

    .lane {
      position: absolute; top: 50%; left: 0; right: 0; height: 4px;
      background: repeating-linear-gradient(90deg, #facc15 0 26px, transparent 26px 52px);
    }

    #player {
      position: absolute; bottom: 26px; left: 36px; z-index: 5;
      padding: 8px 13px; border-radius: 12px;
      background: #22c55e; color: #052e16; font-weight: 800; font-size: 12px;
      border: 2px solid #fff; transition: left 0.12s ease, bottom 0.12s ease;
    }

    .pad {
      background: #111827; border: 1px solid #1f2937; border-radius: 16px;
      padding: 12px; display: flex; flex-direction: column; gap: 10px; align-items: center;
    }

    .btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }

    button {
      padding: 10px 16px; border-radius: 10px; border: none;
      background: #2563eb; color: #fff; font-weight: 700; font-size: 13px; cursor: pointer;
    }

    .info { font-size: 12px; color: #cbd5e1; text-align: center; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top-bar">
      <span class="pill">LIFE STREET</span>
      <span class="pill" id="spotText">Spot: Street Road</span>
    </div>

    <div id="world">
      <div class="hangout">HANGOUT SPOT (PS5 + TV / SQUAD)</div>
      <div class="action-spot">ACTION SPOT (AWM / SNIPER / KATANA / PISTOL)</div>
      <div class="street">
        <div class="lane"></div>
      </div>
      <div id="player">ASAD</div>
    </div>

    <div class="pad">
      <div class="btns">
        <button onclick="step(-24, 0)">Left</button>
        <button onclick="step(24, 0)">Right</button>
        <button onclick="step(0, 22)">Up</button>
        <button onclick="step(0, -22)">Down</button>
      </div>
      <div class="info" id="msg">Buttons dabakar player ko Hangout Spot, Action Spot, ya Street Road par le jao.</div>
    </div>
  </div>

  <script>
    let x = 36;
    let y = 26;

    function updateSpot() {
      const el = document.getElementById("spotText");
      if (y > 185) {
        el.innerText = x < 230 ? "Spot: Hangout Spot" : "Spot: Action Spot";
      } else {
        el.innerText = "Spot: Street Road";
      }
    }

    function step(dx, dy) {
      const world = document.getElementById("world");
      const maxX = Math.max(100, world.clientWidth - 85);
      const maxY = 275;

      x = Math.max(12, Math.min(maxX, x + dx));
      y = Math.max(14, Math.min(maxY, y + dy));

      const player = document.getElementById("player");
      player.style.left = x + "px";
      player.style.bottom = y + "px";

      updateSpot();
    }
  </script>
</body>
</html>
